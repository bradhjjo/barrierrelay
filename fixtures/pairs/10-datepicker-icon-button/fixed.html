<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule a delivery · BarrierRelay fixture</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#18243d;font:16px/1.55 system-ui,sans-serif}
header{height:86px;padding:24px 64px;background:white;border-bottom:1px solid #d7deea;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;letter-spacing:-1px;font-size:25px;color:#243f96}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:750;color:#425678}
main{width:1040px;margin:42px auto;padding:32px;background:white;border:1px solid #d7deea;border-radius:18px;box-shadow:0 14px 40px #18243d0a;min-height:520px}
h1{font-size:32px;line-height:1.2;margin:12px 0}h2{font-size:21px;margin:0 0 12px}p{margin:10px 0;color:#475773}a{color:#244eae}label{display:block;font-weight:650;margin:18px 0 7px}
input{font:inherit;border:1px solid #8b99af;border-radius:7px;padding:12px 14px;width:100%;color:#18243d;background:white}input::placeholder{color:#52617a}
button,.action{font:inherit;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid #2449aa;border-radius:8px;padding:12px 20px;min-height:48px;background:#2449aa;color:white;cursor:pointer;text-decoration:none}
button.secondary{background:white;color:#2449aa}button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #ae3e07;outline-offset:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:20px}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:36px;margin-top:28px}.panel{padding:24px;background:#f6f8fc;border:1px solid #dce2ed;border-radius:12px}.muted{font-size:14px;color:#53627b}.rule{height:1px;background:#dce2ed;margin:20px 0}.price{font-size:23px;font-weight:750}.wide{width:100%;margin-top:22px}.badge{background:#e4f3ed;border-radius:20px;color:#245f43;padding:5px 12px;font-size:13px;font-weight:650}.product{width:100px;height:110px;background:linear-gradient(140deg,#d2dcf0,#aebbd7);display:grid;place-items:center;border-radius:9px;font-size:44px}.center{max-width:520px;margin:22px auto}.switch{width:54px;height:30px;padding:3px;border-radius:20px;background:#475773;cursor:pointer}.switch:before{content:'';display:block;width:24px;height:24px;border-radius:50%;background:white}.switch.on{background:#2449aa}.switch.on:before{margin-left:24px}.navrow{display:flex;gap:24px;padding:20px;background:#edf1fa;border-radius:10px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;margin-top:24px}.day{padding:8px;border-radius:5px;background:#edf1fa}.dialog{border:2px solid #8b99af;box-shadow:0 14px 40px #18243d22;padding:28px;border-radius:12px;margin:20px auto;max-width:520px;background:white}
</style></head><body><header><span class="brand">fieldwork.</span><span class="muted">Made for your everyday</span></header><main id="capture"><div class="center"><span class="eyebrow">Fieldwork delivery</span><h1>A day that works for you</h1><p>Choose when your order arrives. Standard delivery is always free.</p><label for="date">Delivery date</label><div class="row"><input id="date" type="text" placeholder="Select a day" readonly><button data-target aria-label="Open delivery date calendar" onclick="document.getElementById('calendar').hidden=!document.getElementById('calendar').hidden"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18"/></svg></button></div><div id="calendar" hidden><h2>November 2026</h2><div class="calendar"><span class="day">1</span><span class="day">2</span><span class="day">3</span><span class="day">4</span><span class="day">5</span><span class="day">6</span><span class="day">7</span><span class="day">8</span><span class="day">9</span><span class="day">10</span><span class="day">11</span><span class="day">12</span><span class="day">13</span><span class="day">14</span><span class="day">15</span><span class="day">16</span><span class="day">17</span><span class="day">18</span><span class="day">19</span><span class="day">20</span><span class="day">21</span><span class="day">22</span><span class="day">23</span><span class="day">24</span><span class="day">25</span><span class="day">26</span><span class="day">27</span><span class="day">28</span></div></div><p class="muted">Deliveries are available Monday through Saturday.</p><button class="wide">Confirm delivery</button></div></main></body></html>
